version: '3.8'

services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: nornpulse-clickhouse
    ports:
      - "8123:8123"   # HTTP interface (clickhouse-connect, web queries)
      - "9000:9000"   # Native TCP interface
    environment:
      - CLICKHOUSE_DB=nornpulse
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=nornpulse_secret
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  clickhouse_data:
    name: nornpulse_clickhouse_data
