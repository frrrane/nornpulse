[pytest]
# pythonpath so `agent` / `utils` import without a PYTHONPATH prefix.
pythonpath = .
testpaths = tests
# The repo-root test_pipeline.py / test_hitl.py are manual end-to-end
# runners that hit real Gemini/ClickHouse/YouTube APIs. They are NOT
# part of this suite, which is deliberately fast and offline — hence
# testpaths pointing only at tests/.
python_files = test_*.py
addopts = -q --strict-markers
