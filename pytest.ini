[pytest]
# pythonpath so `agent` / `utils` import without a PYTHONPATH prefix.
pythonpath = .
testpaths = tests
# Manual end-to-end runners live in scripts/ so nothing at the repo
# root looks like a pytest file. This suite is deliberately fast and
# offline; testpaths points only at tests/.
python_files = test_*.py
addopts = -q --strict-markers
